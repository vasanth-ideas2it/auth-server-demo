spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:9000
  application:
    name: client
  cloud:
    config:
      uri: http://localhost:8888
  config:
    import: optional:configserver:${spring.cloud.config.uri}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info
  endpoint:
    refresh:
      enabled: true

logging:
  level:
    root: DEBUG
    com.authorization.client: DEBUG
    org:
      springframework:
        security:
          oauth2: DEBUG